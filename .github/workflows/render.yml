name: Render video

on:
  workflow_dispatch: # dijalankan manual lewat tab Actions

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Pasang library sistem untuk Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libdbus-1-3 libatk1.0-0 libgbm-dev libasound2t64 \
            libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 \
            libatk-bridge2.0-0 libcups2
      - run: npm install
      - run: npm run render
      - uses: actions/upload-artifact@v4
        with:
          name: fakta-nyeleneh-mp4
          path: out/fakta.mp4
